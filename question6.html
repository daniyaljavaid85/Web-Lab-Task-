<!DOCTYPE html>
<html>
<head>
    <title>Job Application Form</title>
</head>
<body>

    <h1>Job Application Form</h1>

    <form action="#" method="post">

        <label>Applicant Name:</label>
        <input type="text" name="applicant_name" required><br><br>

        <label>Email:</label>
        <input type="email" name="email" required><br><br>

        <label>Phone Number:</label>
        <input type="tel" name="phone"><br><br>

        <label>Password:</label>
        <input type="password" name="password" required><br><br>

        <label>Gender:</label><br>
        <input type="radio" name="gender" value="male"> Male
        <input type="radio" name="gender" value="female"> Female<br><br>

        <label>Qualification:</label>
        <select name="qualification">
            <option value="intermediate">Intermediate</option>
            <option value="bachelors">Bachelor's</option>
            <option value="masters">Master's</option>
            <option value="phd">PhD</option>
        </select><br><br>

        <label>Job Position:</label>
        <select name="job_position">
            <option value="developer">Software Developer</option>
            <option value="designer">UI/UX Designer</option>
            <option value="qa">QA Engineer</option>
            <option value="manager">Project Manager</option>
        </select><br><br>

        <label>City:</label>
        <input list="cities" name="city">
        <datalist id="cities">
            <option value="Islamabad">
            <option value="Rawalpindi">
            <option value="Lahore">
            <option value="Karachi">
        </datalist><br><br>

        <label>Expected Salary:</label>
        <input type="number" name="expected_salary" min="0"><br><br>

        <label>Available Date:</label>
        <input type="date" name="available_date"><br><br>

        <label>Upload CV:</label>
        <input type="file" name="cv"><br><br>

        <label>Cover Letter:</label><br>
        <textarea name="cover_letter" rows="5" cols="40"></textarea><br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
